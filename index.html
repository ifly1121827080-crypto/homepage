<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ifly wang · 个人主页</title>
<meta name="description" content="ifly wang 的个人主页">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #e8eaf0;
    --muted: #9aa0b0;
    --accent: #6ee7b7;
    --border: #262b36;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 680px; padding: 0 24px; }
  header {
    padding: 96px 0 48px;
    text-align: center;
  }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6ee7b7, #3b82f6);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700; color: #0f1115;
    margin: 0 auto 24px;
  }
  h1 { font-size: 32px; letter-spacing: 1px; }
  .tagline { color: var(--muted); margin-top: 12px; font-size: 16px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 18px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  section h2::before {
    content: ""; width: 4px; height: 18px;
    background: var(--accent); border-radius: 2px;
    display: inline-block;
  }
  section p, section li { color: var(--muted); font-size: 15px; }
  section ul { list-style: none; }
  section li { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  section li:last-child { border-bottom: none; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  .links a {
    display: inline-block;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    transition: all .2s;
  }
  .links a:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  footer {
    padding: 40px 0 64px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="avatar">W</div>
      <h1>ifly wang</h1>
      <p class="tagline">你好，我是 ifly wang，欢迎来到我的小站。</p>
    </header>

    <section>
      <h2>关于我</h2>
      <p>这里写一段自我介绍：你是谁、在做什么、对什么感兴趣。保持简短真诚就好。</p>
    </section>

    <section>
      <h2>在做的事</h2>
      <ul>
        <li>📝 项目一 — 一句话描述</li>
        <li>🛠 项目二 — 一句话描述</li>
        <li>🌱 最近在学 — 一句话描述</li>
      </ul>
    </section>

    <section>
      <h2>找到我</h2>
      <div class="links">
        <a href="https://github.com/ifly1121827080-crypto" target="_blank" rel="noopener">GitHub</a>
        <a href="mailto:ifly1121827080@gmail.com">发邮件</a>
      </div>
    </section>

    <footer>
      <p>© 2026 ifly wang · <a href="https://iflywang.dpdns.org">iflywang.dpdns.org</a></p>
    </footer>
  </div>
</body>
</html>
